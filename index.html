<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎮2048</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7"></script>
<script>
  if (!window.supabase) {
    document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.39.7"><\/script>');
  }
</script>

<!-- ② 紧跟着，立刻检查有没有加载成功 -->
<script>
if (!window.supabase) {
  alert("Supabase SDK 加载失败，请刷新或检查网络");
}
</script>

<style>
*{ box-sizing:border-box; }

body{
  margin:0;
  color:#e0e0e0;
  font-family:monospace;
  display:flex;
  justify-content:center;
  padding:40px 0;
  overflow-x: hidden;

  background-color:#1e1e1e;
  background-image:
    repeating-linear-gradient(
      45deg,
      rgba(46,204,113,0.12) 0px,
      rgba(46,204,113,0.12) 1px,
      transparent 1px,
      transparent 24px
    ),
    repeating-linear-gradient(
      -45deg,
      rgba(231,76,60,0.08) 0px,
      rgba(231,76,60,0.08) 1px,
      transparent 1px,
      transparent 24px
    );
}

.game {
  background: #2b2b2b;      /* 游戏盒子的背景颜色（深灰色） */
  padding: 14px;            /* 盒子的内边距（内容距离边缘的间隙） */
  border-radius: 8px;       /* 盒子四个角的圆角弧度 */
  width: 380px;             /* 盒子的总宽度（你现在调成了400px） */
  /* 以下三行决定了内部元素（分数、网格、排行榜）如何排列 */
  display: flex;            /* 开启弹性布局 */
  flex-direction: column;   /* 让内部元素垂直排列（从上往下排） */
  gap: 10px;                /* 内部各个组件（如网格和按钮）之间的垂直距离 */ 
  margin: 0 auto;           /* 让整个游戏盒子在网页页面水平居中 */
}

.top {
  display: flex;                /* 开启弹性布局，让“得分”和“状态”能排在同一行 */
  /* 左右对齐：让“得分”靠左边，让“Game Over提示”靠右边，中间留出空隙 */
  justify-content: space-between; 
  font-size: 14px;              /* 这一行文字的大小 */
}

.grid {
  display: grid;                /* 开启网格布局模式 */
  /* 定义列数：repeat(4, 70px) 表示创建 4 列，每列宽度固定为 70px */
  /* 如果你调大了 .cell 的宽度，这里必须同步把 70px 改掉 */
  grid-template-columns: repeat(4, 82px); 
  grid-template-rows: repeat(4, 82px); 
  gap: 5px;                     /* 方块与方块之间的缝隙距离 */
  background: #555;             /* 整个网格底盘的背景颜色（通常比方块深） */
  padding: 5px;                 /* 底盘边缘与内部方块之间的距离 */
  border-radius: 6px;           /* 底盘四个角的圆角弧度 */
  justify-content: center;      /* 让所有的方块在底盘内水平居中 */
  touch-action: none;           /* 禁用浏览器默认的触摸滚动（防止手机玩游戏时页面乱跳） */
  /* 确保垂直方向也是正方形 */
}

.cell {
  background: #777;           /* 方块的背景颜色（空方块时的灰色） */
  height: 82px;               /* 方块的高度 */
  width: 82px;                /* 方块的宽度（宽高一致即为正方形） */
  /* 以下三行用于让数字在方块里水平、垂直绝对居中 */
  display: flex;              /* 使用弹性盒子布局 */
  align-items: center;        /* 数字垂直居中 */
  justify-content: center;    /* 数字水平居中 */
  font-size: 30px;            /* 数字的大小 */
  font-weight: bold;          /* 数字加粗 */
  border-radius: 4px;         /* 方块四个角的圆角弧度 */
  /* 下面这一行负责方块移动或合并时的平滑动画效果 */
  transition: transform 0.12s ease, background-color 0.15s ease;
}

/* 🎨 高级方块配色 */

.v2    { background:#e74c3c; color:#fff; }  /* 数字2：红色背景，白色字 */
.v4    { background:#27ae60; color:#fff; }  /* 数字4：绿色背景，白色字 */
.v8    { background:#f1c40f; color:#000; }  /* 数字8：黄色背景，黑色字（黄色背景配黑字更清晰） */
.v16   { background:#e67e22; color:#fff; }  /* 数字16：橙色背景 */
.v32   { background:#d35400; color:#fff; }  /* 数字32：深橙色背景 */
.v64   { background:#c0392b; color:#fff; }  /* 数字64：暗红色背景 */

/* 从128开始，方块增加了 box-shadow（外发光/阴影）效果，让高级方块看起来在“发光” */
.v128  { background:#1abc9c; color:#fff; box-shadow: 0 0 10px #1abc9c; }
.v256  { background:#3498db; color:#fff; box-shadow: 0 0 12px #3498db; }
.v512  { background:#9b59b6; color:#fff; box-shadow: 0 0 15px #9b59b6; }
.v1024 { background:#f39c12; color:#fff; box-shadow: 0 0 20px #f39c12; font-size: 20px; }

/* 强烈的荧光青色发光效果 */
.v2048 { 
  background: #111; 
  color: #00ffcc; 
  border: 2px solid #00ffcc; 
  box-shadow: 0 0 20px #00ffcc; 
  font-size: 20px;
}

/* 4096: 亮粉色，带强光 */
.v4096 { 
  background: #ff00de; 
  color: #fff; 
  box-shadow: 0 0 25px #ff00de; 
  font-size: 20px;
}

/* 8192: 深紫色，带有霓虹边框 */
.v8192 { 
  background: #6a0dad; 
  color: #fff; 
  border: 2px solid #e0b0ff;
  box-shadow: 0 0 30px #6a0dad; 
  font-size: 20px;
}

/* 16384: 纯白色背景，黑色数字（极简致盲光） */
.v16384 { 
  background: #ffffff; 
  color: #000; 
  box-shadow: 0 0 40px #ffffff; 
  font-size: 16px;
}

/* 32768: 动态金黑色 */
.v32768 { 
  background: #000; 
  color: #ffd700; 
  border: 3px double #ffd700;
  box-shadow: 0 0 50px #ffd700; 
  font-size: 16px;
}

button {
  background: #444;      /* 按钮的背景颜色（深灰色） */
  color: #fff;           /* 按钮内文字的颜色（白色） */
  border: none;          /* 去掉按钮默认的边框（让它看起来更扁平、现代） */
  padding: 8px;          /* 按钮的内边距（文字到按钮边缘的距离，决定按钮的大小） */
  border-radius: 4px;    /* 按钮四个角的圆角弧度 */
  cursor: pointer;       /* 鼠标悬停在按钮上时，光标变成“小手”形状（提示可以点击） */
}

/* 排行榜 */
.rank{
  background:#1f1f1f;
  border-radius:6px;
  padding:8px;
  font-size:12px;
  display:flex;
  flex-direction:column;
  gap:6px;
  min-height: 100px;
  transition: opacity 0.3s;
}

.rank-title { 
  display: flex; 
  align-items: center; 
  justify-content: space-between; 
  font-weight: bold; 
  border-bottom: 1px solid #444; 
  padding-bottom: 4px; 
}

.refresh-btn {
  background: #333;
  color: #fff;
  border: none;
  padding: 2px 6px;
  border-radius: 4px;
  cursor: pointer;
  font-size: 10px;
}

.rank-header, .rank-row { 
  display: grid;                /* 开启网格布局，让序号、名字、分数、时间整齐对齐 */
  
  /* 核心设置：定义四列的宽度分配 */
  /* 30px: 第一列（序号 #）固定宽度 */
  /* 1fr:  第二列（名字）占用剩余的所有空间（自适应宽度） */
  /* 50px: 第三列（分数）固定宽度 */
  /* 110px:第四列（时间）固定宽度，确保 YYYY-MM-DD HH:MM:SS 不换行 */
  grid-template-columns: 25px 110px 50px 110px; 
  
  gap: 4px;                     /* 每一列之间的水平间隙 */
  align-items: center;          /* 让这一行里的所有内容在垂直方向上居中对齐 */
}

.rank-index { text-align: right; color: #fff; }
.rank-header { color:#aaa; }
.rank-list { max-height:160px; overflow-y:auto; overflow-x:hidden; }
.rank-name { overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.rank-score { text-align: left; }

.rank-time { 
  text-align: right;    /* 文字向右对齐，让时间数字的末尾整齐排列 */
  opacity: 0.8;         /* 透明度设为 0.8（稍微变淡），使其视觉权重低于名字和分数 */
  
  font-size: 11px;      /* 字体大小。时间字符多，适合用较小的字号防止拥挤 */
  padding-right: 2px;   /* 右侧内边距，防止时间文字紧贴着排行榜的最右边缘 */
  
  /* 关键属性：强制文字在同一行显示，绝对不允许因为空间不足而折行 */
  white-space: nowrap;  
  
  line-height: 1.5;     /* 行高。增加一点行间距，让上下行的时间看起来不那么拥挤 */
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.65);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.modal-box{
  background:#2b2b2b;
  padding:16px;
  border-radius:8px;
  width:320px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.hint { text-align: center; font-size: 12px; color: #fff; letter-spacing: 2px; user-select: none; }

@keyframes pop { 0% { transform: scale(0.8); } 100% { transform: scale(1); } }
.cell.moved{ animation: pop 0.18s ease; }
@keyframes spawn { 0% { transform: scale(0.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.cell.spawn{ animation: spawn 0.2s ease-out; }
</style>

</head>

<body>
<div class="game">
  <div class="top">
    <div>得分：<span id="score">0</span></div>
    <div id="status"></div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="hint">⬆️ ⬅️ ⬇️ ➡️ 移动方块</div>

  <button onclick="restart()">重新开始</button>

  <div class="rank" id="rank">正在读取排行榜…</div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div style="text-align:center; font-weight:bold;">Game over!</div>
    <div>你的得分是：<span id="finalScore"></span></div>
    <div style="font-size:13px; opacity:0.8; margin-bottom:4px;">请输入昵称...组织上会记住你的!</div>
    <input id="playerName" placeholder="匿名玩家" maxlength="16" style="width:100%; padding:6px; border-radius:4px; border:none;">
    <div style="display:flex; gap:8px; justify-content:center; margin-top:8px;">
      <button onclick="submitScore()" id="subBtn">记录得分</button>
      <button onclick="closeModal()">概不留名</button>
    </div>
  </div>
</div>

<script>
const supabaseUrl = "https://jyqfaxhrnizcfdxechkc.supabase.co";
const supabaseKey = "sb_publishable_8yLhtmHiVnYr4kRwajJ98A_Sh7VPGnN";
const db = supabase.createClient(supabaseUrl, supabaseKey);

let grid = Array(16).fill(0);
let score = 0;
let gameOver = false;
let spawnedIndex = null;
let lastGrid = Array(16).fill(0);

const gridEl = document.getElementById("grid");
const scoreEl = document.getElementById("score");
const statusEl = document.getElementById("status");
const rankEl = document.getElementById("rank");

function draw(){
  gridEl.innerHTML="";
  grid.forEach((v,i)=>{
    let d = document.createElement("div");
    d.className = "cell" + (v ? " v"+v : "");
    if(v !== lastGrid[i]) d.classList.add("moved");
    if(i === spawnedIndex) d.classList.add("spawn");
    d.textContent = v || "";
    gridEl.appendChild(d);
  });
  lastGrid = [...grid];
  spawnedIndex = null;
  scoreEl.textContent = score;
}

function randomAdd(){
  let e = grid.map((v,i)=>v===0?i:null).filter(v=>v!==null);
  if(!e.length) return;
  spawnedIndex = e[Math.floor(Math.random()*e.length)];
  grid[spawnedIndex] = Math.random() < 0.9 ? 2 : 4;
}

function slide(arr){
  arr=arr.filter(v=>v);
  for(let i=0;i<arr.length-1;i++){
    if(arr[i]===arr[i+1]){
      arr[i]*=2;
      score+=arr[i];
      arr[i+1]=0;
    }
  }
  arr=arr.filter(v=>v);
  while(arr.length<4)arr.push(0);
  return arr;
}

function move(dir){
  if(gameOver) return;
  let moved=false;
  let g=[...grid];
  const idx=(i,j)=>{
    if(dir==="L")return i*4+j;
    if(dir==="R")return i*4+3-j;
    if(dir==="U")return j*4+i;
    return 12-j*4+i;
  };
  for(let i=0;i<4;i++){
    let line=[];
    for(let j=0;j<4;j++)line.push(g[idx(i,j)]);
    let s=slide(line);
    for(let j=0;j<4;j++){
      let k=idx(i,j);
      if(grid[k]!==s[j]){grid[k]=s[j];moved=true;}
    }
  }
  if(moved){
    randomAdd();
    draw();
    checkOver();
  }
}

function checkOver(){
  if(grid.includes(0))return;
  for(let i=0;i<16;i++){
    if(i%4<3 && grid[i]===grid[i+1])return;
    if(i<12 && grid[i]===grid[i+4])return;
  }
  gameOver = true;
  statusEl.textContent = "Game over!☠️☠️☠️";
  openModal();
}

function formatTime(t){
  const utc = new Date(t).getTime();
  const beijing = new Date(utc + 8 * 60 * 60 * 1000);
  const Y = beijing.getFullYear();
  const M = String(beijing.getMonth() + 1).padStart(2, "0");
  const D = String(beijing.getDate()).padStart(2, "0");
  const h = String(beijing.getHours()).padStart(2, "0");
  const m = String(beijing.getMinutes()).padStart(2, "0");
  const s = String(beijing.getSeconds()).padStart(2, "0");
  
  // 将这里的 <br> 替换为空格
  return `${Y}-${M}-${D} ${h}:${m}:${s}`; 
}

// 🌐 移植：网络优化后的加载函数
async function loadRank(){
  rankEl.style.opacity = "0.6";
  try {
    let { data, error } = await db.from("scores").select("*").order("score",{ ascending:false }).limit(50);
    if(error) throw error; // 抛出错误进入 catch

    rankEl.innerHTML=`
      <div class="rank-title">
        <button class="refresh-btn" onclick="loadRank()">刷新</button>
        <span>🌍 排行榜 ⭐</span>
        <div style="width:30px"></div>
      </div>
      <div class="rank-header">
        <div class="rank-index">#</div>
        <div class="rank-name">玩家</div>
        <div class="rank-score">分数</div>
        <div class="rank-time">时间</div>
      </div>
      <div class="rank-list">
        ${data.map((v,i)=>{
          let displayIndex = i===0 ? "👑1" : i+1;
          let nameColor = i === 0 ? "#FFD700" : i === 1 ? "#C0C0C0" : i === 2 ? "#CD7F32" : "#e0e0e0";
          return `
            <div class="rank-row">
              <div class="rank-index">${displayIndex}</div>
              <div class="rank-name" style="color:${nameColor};" title="${v.name}">${v.name}</div>
              <div class="rank-score">${v.score}</div>
              <div class="rank-time">${formatTime(v.created_at)}</div>
            </div>
          `;
        }).join("")}
      </div>
    `;
  } catch(e) {
    // 🌐 移植：错误处理界面
    rankEl.innerHTML = `
      <div class="rank-title">
        <button class="refresh-btn" onclick="loadRank()">重试</button>
        <span style="color:#ff6b6b;">同步失败 📡</span>
        <div style="width:30px"></div>
      </div>
      <div style="text-align:center; padding:15px; font-size:11px; opacity:0.6;">无法连接排行榜，请检查网络。</div>
    `;
  }
  rankEl.style.opacity = "1";
}

document.addEventListener("keydown", e => {
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key)) e.preventDefault();
  if(e.key==="ArrowLeft") move("L");
  if(e.key==="ArrowRight") move("R");
  if(e.key==="ArrowUp") move("U");
  if(e.key==="ArrowDown") move("D");
});

let sx, sy;
gridEl.addEventListener("touchstart", e=>{
  sx = e.touches[0].clientX;
  sy = e.touches[0].clientY;
},{ passive:false });

gridEl.addEventListener("touchend", e=>{
  let dx = e.changedTouches[0].clientX - sx;
  let dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) > Math.abs(dy)){
    if(dx > 30) move("R");
    if(dx < -30) move("L");
  } else {
    if(dy > 30) move("D");
    if(dy < -30) move("U");
  }
},{ passive:false });

function restart(){
  grid.fill(0);
  score = 0;
  gameOver = false;
  statusEl.textContent = "";
  randomAdd();
  randomAdd();
  draw();
}

function openModal(){
  document.getElementById("finalScore").textContent = score;
  document.getElementById("modal").style.display = "flex";
}

async function submitScore(){
  const btn = document.getElementById("subBtn");
  let name = document.getElementById("playerName").value.trim() || "匿名玩家";
  
  btn.disabled = true;
  btn.textContent = "记录中...";
  
  try {
    const { error } = await db.from("scores").insert({ name, score });
    if(error) throw error;
    document.getElementById("modal").style.display = "none";
    loadRank();
  } catch(e) {
    alert("分数提交失败，请重试。");
  } finally {
    btn.disabled = false;
    btn.textContent = "记录得分";
  }
}

function closeModal(){
  document.getElementById("modal").style.display = "none";
}

restart();
loadRank();
</script>
</body>
</html>
